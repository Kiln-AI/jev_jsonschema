[project]
name = "jev_jsonschema"
version = "0.1.0"
description = "Run a JSON Schema through TypeSafe's Jev API, and get JSON back."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Kiln AI", email = "scosman@gmail.com" }]
keywords = ["jev", "typesafe", "json-schema", "structured-output", "llm", "evals"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = ["pydantic>=2.0"]

[project.urls]
Homepage = "https://github.com/Kiln-AI/jev_jsonschema"
Repository = "https://github.com/Kiln-AI/jev_jsonschema"
Issues = "https://github.com/Kiln-AI/jev_jsonschema/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_jsonschema"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "README.md", "LICENSE"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "jsonschema>=4.0",
    "ruff>=0.14",
    "ty>=0.0.1a10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"

[tool.ruff]
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "B",    # bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "RUF",  # ruff
]
# The formatter owns line width. E501 only ever fires on prose we can't wrap.
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# MappingOptions is a frozen dataclass, so it's a safe default argument.
extend-immutable-calls = ["jev_jsonschema.to_jev.MappingOptions"]

[tool.ty.environment]
python-version = "3.10"

[tool.ty.src]
include = ["src", "tests"]
